<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#8fc4ff}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js"}}</script></head><body>
<script type="module">
import * as THREE from 'three';
const W=1600,H=900;
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setSize(W,H);renderer.shadowMap.enabled=true;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9cc8f0);scene.fog=new THREE.Fog(0xb8d4f0,250,900);
scene.add(new THREE.HemisphereLight(0xffffff,0x6a7a5a,1.1));
const sun=new THREE.DirectionalLight(0xfff1dd,2.2);sun.position.set(-150,300,-120);sun.castShadow=true;
sun.shadow.mapSize.set(4096,4096);Object.assign(sun.shadow.camera,{left:-400,right:400,top:400,bottom:-400,near:1,far:1200});scene.add(sun);
const geos={box:new THREE.BoxGeometry(1,1,1),ball:new THREE.SphereGeometry(0.5,24,16),head:new THREE.SphereGeometry(0.55,24,16),wedge:new THREE.BoxGeometry(1,1,1)};
const cyl=new THREE.CylinderGeometry(0.5,0.5,1,24);cyl.rotateZ(Math.PI/2);geos.cyl=cyl;
window.build=(data)=>{
  for(const row of data.split(';')){
    const f=row.split(',');if(f.length<13)continue;
    const [shape,x,y,z,rx,ry,rz,sx,sy,sz,hex,tr,neon]=f;
    const c=new THREE.Color('#'+hex);
    const mat=new THREE.MeshStandardMaterial({color:c,roughness:0.7,metalness:0.05,transparent:+tr>0,opacity:1-(+tr),emissive:+neon?c:new THREE.Color(0),emissiveIntensity:+neon?0.9:0});
    let g=geos[shape]||geos.box;
    const m=new THREE.Mesh(g,mat);
    let S=[+sx,+sy,+sz];
    if(shape==='ball'){const d=Math.min(...S);S=[d,d,d];}
    if(shape==='cyl'){const d=Math.min(+sy,+sz);S=[+sx,d,d];}
    if(shape==='head'){S=[+sx*0.62,+sy*1.25,+sz*1.25];}
    m.scale.set(...S);m.position.set(+x,+y,+z);m.rotation.set(+rx,+ry,+rz,'XYZ');
    m.castShadow=true;m.receiveShadow=true;scene.add(m);
  }
};
window.shot=(px,py,pz,tx,ty,tz,fov)=>{
  const cam=new THREE.PerspectiveCamera(fov||60,W/H,0.5,3000);cam.position.set(px,py,pz);cam.lookAt(tx,ty,tz);
  renderer.render(scene,cam);return true;
};
window.ready=true;
</script></body></html>
